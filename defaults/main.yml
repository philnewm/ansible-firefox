    updates_disabled: false
    private_browsing: true
    guid: "{ad213ecb-ae95-4ac8-ac7a-5925ba36ea1d}"
    url: "https://addons.mozilla.org/firefox/downloads/file/3914147/matte_black_violet-2022.2.23.xpi"


firefox_default_config:
  redhat: "/usr/lib64/firefox/browser/defaults/preferences/all-redhat.js"
  almalinux: "/usr/lib64/firefox/browser/defaults/preferences/all-redhat.js"
  centos: "/usr/lib64/firefox/browser/defaults/preferences/all-redhat.js"
  rocky: "/usr/lib64/firefox/browser/defaults/preferences/all-redhat.js"
  fedora: "/usr/lib64/firefox/browser/defaults/preferences/firefox-redhat-default-prefs.js"
  debian: "/usr/lib/firefox/browser/defaults/preferences/firefox-debian-default-prefs.js"
  ubuntu: "/usr/lib/firefox/browser/defaults/preferences/firefox-debian-default-prefs.js"

firefox_user_config_fallback_version: "141"
# Note flatpak changes some of these values
firefox_user_config:
  "config_default": &config_default
    "general.autoScroll": true
    "layout.css.prefers-color-scheme.content-override": 0
    "browser.startup.homepage": "data:text/plain,browser.startup.homepage=https:duckduckgo.com/"
    "browser.newtabpage.activity-stream.showSponsoredTopSites": false
    "places.history.enabled": false
    "browser.formfill.enable": false
    "privacy.clearHistory.siteSettings": true
    "privacy.clearOnShutdown.offlineApps": true
    "privacy.clearOnShutdown_v2.siteSettings": true
    "privacy.donottrackheader.enabled": true
    "privacy.globalprivacycontrol.enabled": true
    "privacy.globalprivacycontrol.was_ever_enabled": true
    "privacy.history.custom": true
    "privacy.sanitize.clearOnShutdown.hasMigratedToNewPrefs2": true
    "privacy.sanitize.cpd.hasMigratedToNewPrefs2": true
    "privacy.sanitize.sanitizeOnShutdown": true
    "privacy.userContext.enabled": true
    "signon.rememberSignons": false
    "browser.backspace_action": 0
  "128":
    <<: *config_default
    # "privacy.sanitize.pending": "[{\"id\":\"shutdown\",\"itemsToClear\":[\"browsingHistoryAndDownloads\",\"formdata\",\"sessions\"],\"options\":{}}]"
    # Warning setting seems to change inconsistently
    # "privacy.sanitize.pending": "[{\"id\":\"shutdown\",\"itemsToClear\":[\"cache\",\"siteSettings\",\"historyFormDataAndDownloads\",\"cookiesAndStorage\"],\"options\":{}},{\"id\":\"newtab-container\",\"itemsToClear\":[],\"options\":{}}]"
  "140":
    <<: *config_default
  "141": &141
    <<: *config_default
    # Note auto theme enabling wont work with firefox-esr version due to conservative behavior in terms of customizations
    "extensions.activeThemeID": "{ad213ecb-ae95-4ac8-ac7a-5925ba36ea1d}"
    # "privacy.sanitize.pending": "[{\"id\":\"shutdown\",\"itemsToClear\":[\"cache\",\"siteSettings\",\"browsingHistoryAndDownloads\",\"cookiesAndStorage\"],\"options\":{}},{\"id\":\"newtab-container\",\"itemsToClear\":[],\"options\":{}}]"
  "143":
    <<: *141
  "144":
    <<: *141
  "145":
    <<: *141

...
