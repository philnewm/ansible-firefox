---

firefox_source: default
firefox_extensions_enabled: true

firefox_package:
  default:
    "redhat": firefox
    "debian": firefox
  esr:
    "redhat": firefox
    "debian": firefox-esr

# Note flatpak doesn't support system-wide extensions
firefox_extensions:
  - name: "DuckDuckGo Privacy Essentials"
    slug: "duckduckgo-for-firefox"
    installation_mode: "normal_installed"
    updates_disabled: false
    private_browsing: true
    guid: "jid1-ZAdIEUB7XOzOJw@jetpack"
    url: 	"https://addons.mozilla.org/firefox/downloads/file/4613887/duckduckgo_for_firefox-2025.11.3.xpi"
  - name: "Dark Reader"
    slug: "darkreader"
    installation_mode: "normal_installed"
    updates_disabled: false
    private_browsing: true
    guid: "addon@darkreader.org"
    url: "https://addons.mozilla.org/firefox/downloads/file/4665768/darkreader-4.9.119.xpi"
  - name: "Bitwarden Password Manager"
    slug: "bitwarden-password-manager"
    installation_mode: "normal_installed"
    updates_disabled: false
    private_browsing: true
    guid: "{446900e4-71c2-419f-a6a7-df9c091e268b}"
    url: "https://addons.mozilla.org/firefox/downloads/file/4664623/bitwarden_password_manager-2025.12.1.xpi"
  - name: "AdGuard AdBlocker"
    slug: "adguard-adblocker"
    installation_mode: "normal_installed"
    updates_disabled: false
    private_browsing: true
    guid: "adguardadblocker@adguard.com"
    url: "https://addons.mozilla.org/firefox/downloads/file/4644736/adguard_adblocker-5.2.700.1.xpi"
  - name: "Private Grammar Checker - Harper"
    slug: "private-grammar-checker-harper"
    installation_mode: "normal_installed"
    updates_disabled: false
    private_browsing: true
    guid: "harper@writewithharper.com"
    url: "https://addons.mozilla.org/firefox/downloads/file/4660884/private_grammar_checker_harper-1.4.1.xpi"
  - name: "Enhancer for YouTube™"
    slug: "enhancer-for-youtube"
    installation_mode: "normal_installed"
    updates_disabled: false
    private_browsing: true
    guid: "enhancerforyoutube@maximerf.addons.mozilla.org"
    url: "https://addons.mozilla.org/firefox/downloads/file/4393561/enhancer_for_youtube-2.0.130.1.xpi"
  - name: "Behind The Overlay"
    slug: "behind_the_overlay"
    installation_mode: "normal_installed"
    updates_disabled: false
    private_browsing: true
    guid: "jid1-Y3WfE7td45aWDw@jetpack"
    url: "https://addons.mozilla.org/firefox/downloads/file/3923294/behind_the_overlay-0.2.1.xpi"
  - name: "Dictionary Anywhere"
    slug: "dictionary-anywhere"
    installation_mode: "normal_installed"
    updates_disabled: false
    private_browsing: true
    guid: "jid0-fbHwsGfb6kJyq2hj65KnbGte3yT@jetpack"
    url: "https://addons.mozilla.org/firefox/downloads/file/4582592/dictionary_anywhere-0.6.3.xpi"
  - name: "GNOME Shell integration"
    slug: "gnome-shell-integration"
    installation_mode: "normal_installed"
    updates_disabled: false
    private_browsing: true
