---

- name: Enable esr release on Ubuntu
  when: ansible_distribution | lower == "ubuntu"
  block:
    - name: Ensure required packages for apt repositories are installed
      become: true
      ansible.builtin.apt:
        name: software-properties-common
        state: present
        update_cache: true

    - name: Add MozillaTeam PPA
      become: true
      ansible.builtin.apt_repository:
        repo: ppa:mozillateam/ppa
        state: present

- name: Install firefox package
  become: true
  ansible.builtin.package:
    name: "{{ firefox_package[firefox_source][ansible_facts.os_family | lower] }}"
    state: present

...
